<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Croc Crossing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0f3d2e; --panel:#fff8ec; --ink:#1d2a24; --orange:#ff7a1a; --blue:#2f7fd8; --green:#3fa34d; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:'Baloo 2',system-ui,sans-serif; overflow:hidden; touch-action:none; user-select:none; -webkit-user-select:none; }
  #wrap { height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; padding:8px; }
  #stage { position:relative; }
  canvas { display:block; border-radius:14px; box-shadow:0 8px 30px rgba(0,0,0,.4); background:#000; }
  #pad { display:grid; grid-template-columns:repeat(3,72px); grid-template-rows:repeat(2,58px); gap:6px; }
  #pad button { font:inherit; font-size:30px; border:0; border-radius:16px; background:#ffffffdd; color:var(--ink); box-shadow:0 4px 0 #0005; }
  #pad button:active { transform:translateY(3px); box-shadow:0 1px 0 #0005; background:#ffe2c9; }
  #pad .up { grid-column:2; grid-row:1; } #pad .left { grid-column:1; grid-row:2; } #pad .down { grid-column:2; grid-row:2; } #pad .right { grid-column:3; grid-row:2; }
  #topbtns { position:absolute; top:8px; left:8px; display:flex; gap:6px; }
  #topbtns button { font:inherit; font-size:15px; padding:4px 10px; border:0; border-radius:10px; background:#ffffffcc; }
  .overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:#0008; border-radius:14px; }
  .hidden { display:none !important; }
  .card { background:var(--panel); border-radius:22px; padding:22px 26px; width:min(88%,520px); text-align:center; box-shadow:0 10px 0 #0004; }
  .card h1 { margin:0; font-size:46px; line-height:1; color:var(--green); }
  .card h2 { margin:0 0 6px; font-size:34px; line-height:1.1; }
  .card p { font-size:21px; margin:8px 0; line-height:1.25; }
  .card .big { font-size:64px; line-height:1.1; margin:4px 0; }
  .btn { font:inherit; font-size:28px; font-weight:800; border:0; border-radius:18px; padding:10px 26px; margin:8px 6px 0; color:#fff; background:var(--orange); box-shadow:0 6px 0 #a5490a; cursor:pointer; }
  .btn:active { transform:translateY(4px); box-shadow:0 2px 0 #a5490a; }
  .btn.blue { background:var(--blue); box-shadow:0 6px 0 #1b4f8c; }
  .players { display:flex; gap:14px; justify-content:center; margin-top:14px; }
  .pbtn { font:inherit; border:0; border-radius:22px; padding:12px 18px; min-width:150px; color:#fff; cursor:pointer; box-shadow:0 6px 0 #0005; }
  .pbtn b { display:block; font-size:34px; line-height:1; } .pbtn span { font-size:17px; }
  .small { font-size:15px !important; color:#56645d; }
  select { font:inherit; font-size:16px; border-radius:8px; padding:2px 6px; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="game" width="704" height="832"></canvas>
    <div id="topbtns" class="hidden"><button id="menuBtn">☰ Menu</button></div>

    <div id="menu" class="overlay">
      <div class="card">
        <h1>🐊 Croc Crossing</h1>
        <p>Hop over the road, ride the river,<br>and find the right letters!</p>
        <div class="players">
          <button class="pbtn" style="background:#ff7a1a" data-player="Felix"><b>Felix</b><span id="lvFelix">Level 1</span></button>
          <button class="pbtn" style="background:#2f7fd8" data-player="Remi"><b>Remi</b><span id="lvRemi">Level 1</span></button>
        </div>
        <p class="small">Grown-ups: start at level
          <select id="lvlPick"><option value="">saved</option></select>
          · 1–3 letters · 4–6 sounds · 7–9 three-letter words · 10–12 four · 13+ big words · car bonus every 3 levels</p>
      </div>
    </div>

    <div id="card" class="overlay hidden">
      <div class="card">
        <h2 id="cardTitle"></h2>
        <div class="big" id="cardBig"></div>
        <p id="cardText"></p>
        <button class="btn" id="cardBtn">Go!</button>
      </div>
    </div>
  </div>
  <div id="pad">
    <button class="up" data-k="up">⬆️</button>
    <button class="left" data-k="left">⬅️</button>
    <button class="down" data-k="down">⬇️</button>
    <button class="right" data-k="right">➡️</button>
  </div>
</div>
<script src="data.js"></script>
<script src="game.js"></script>
</body>
</html>
